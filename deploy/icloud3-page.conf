# Shared page vhost: any domain pointed here gets the gated page.
server_tokens off;
client_max_body_size 32m;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:icloud3:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
add_header Referrer-Policy "no-referrer" always;
# Express also sets these; keep exactly one copy on proxied responses.
proxy_hide_header X-Robots-Tag;
proxy_hide_header Referrer-Policy;

# No Basic Auth on the page itself: the page gate (server/gate.js) decides
# who sees the app and answers everyone else with the iCloud decoy.  Keeping
# auth_basic on / would return 401 before Express can issue that 302.
# The operator console and its API stay behind Basic Auth.
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

# Browser already passed the page gate; websocket upgrades cannot carry
# the Basic challenge reliably, so leave only this path unauthenticated.
location /socket.io/ {
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 600s;
    proxy_buffering off;
}

# Operator console (exempt from the page gate) + its API: Basic Auth.
location ^~ /admin {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd-icloud3;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location ^~ /api/admin/ {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd-icloud3;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 5s;
}

location = /api/geo {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
}

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 5s;
}

# Visitor page: its own process, so an admin/API OOM cannot 502 the page.
location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    # The visitor process restarts in ~1s; show a spinner, not Cloudflare's 502.
    error_page 502 503 504 = @page_retry;
}

location @page_retry {
    default_type text/html;
    add_header Retry-After 2 always;
    add_header Cache-Control "no-store" always;
    return 200 '<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Loading</title><body style="margin:0;height:100vh;display:grid;place-items:center;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><div style="text-align:center"><div style="width:28px;height:28px;margin:0 auto 14px;border:3px solid #e5e5e5;border-top-color:#111;border-radius:50%;animation:spin 1s linear infinite"></div><p style="font-size:13px;color:#666">Loading&hellip;</p></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style><script>setTimeout(function(){location.reload()},2000)</script>';
}

location = /download {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
